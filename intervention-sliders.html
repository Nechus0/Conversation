<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Does our intervention work?</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1a1d21; --muted: #6b7280; --line: #e5e7eb; --accent: #0b7a5a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111315; --card: #1a1d21; --text: #e8eaed; --muted: #9aa0a6; --line: #2a2e33; --accent: #4cc79f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 1.6rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 20px; }
  .field { display: block; padding: 14px 0; }
  .field + .field { border-top: 1px solid var(--line); }
  .head { display: flex; justify-content: space-between; gap: 12px; }
  .head output { font-weight: 700; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; margin: 10px 0 0; accent-color: var(--accent); height: 24px; }
  .seg { display: flex; gap: 8px; margin-top: 8px; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .seg button { flex: 1; }
  .seg button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #result { font-size: 1.5rem; font-weight: 700; text-align: center; margin: 28px 0; }
  #result b { color: var(--accent); }
  .chart { margin-bottom: 24px; }
  .chart svg { width: 100%; height: auto; display: block; touch-action: none; }
  .chart text { fill: var(--muted); font-size: 12px; }
  .chart .grid { stroke: var(--line); }
  .chart .curve { fill: none; stroke: var(--accent); stroke-width: 2; }
  .chart .dot { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
  .chart .label { fill: var(--text); font-weight: 700; }
  .chart .hair { stroke: var(--muted); stroke-dasharray: 3 3; }
  .example { text-align: center; }
  #exampleText { color: var(--muted); margin: 10px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Does our intervention work?</h1>

  <div class="card">
    <label class="field">
      <span class="head">Outcome without intervention <output id="p2v"></output></span>
      <input type="range" id="p2" min="1" max="99" value="40">
    </label>
    <label class="field">
      <span class="head">Outcome with intervention <output id="p1v"></output></span>
      <input type="range" id="p1" min="1" max="99" value="60">
    </label>
    <div class="field">
      <span class="head">Power</span>
      <div class="seg" id="power">
        <button data-z="0.8416" aria-pressed="true">80%</button>
        <button data-z="1.2816" aria-pressed="false">90%</button>
      </div>
    </div>
    <label class="field">
      <span class="head">Drop-out <output id="dropv"></output></span>
      <input type="range" id="drop" min="0" max="50" value="10">
    </label>
  </div>

  <p id="result" aria-live="polite"></p>

  <div class="card chart" id="chartCard">
    <svg id="chart" role="img" aria-label="Participants needed per group by difference between groups"></svg>
  </div>

  <div class="example">
    <button id="example">Try an example</button>
    <p id="exampleText" hidden>A text-message reminder raises second-dose returns from 40% to 60%.</p>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const powerButtons = document.querySelectorAll("#power button");

// Participants per group to compare two proportions (two-sided, 5% significance).
function perGroup(p1, p2, zb, drop) {
  const pbar = (p1 + p2) / 2;
  const n = (1.96 * Math.sqrt(2 * pbar * (1 - pbar)) + zb * Math.sqrt(p1 * (1 - p1) + p2 * (1 - p2))) ** 2 / (p1 - p2) ** 2;
  return Math.ceil(n / (1 - drop) - 1e-9);
}

function update() {
  const p2 = +$("p2").value, p1 = +$("p1").value, drop = +$("drop").value;
  const zb = +document.querySelector("#power [aria-pressed=true]").dataset.z;
  $("p2v").textContent = p2 + "%";
  $("p1v").textContent = p1 + "%";
  $("dropv").textContent = drop + "%";

  if (p1 === p2) {
    $("result").textContent = "The groups must differ.";
    $("chartCard").style.opacity = 0.35;
    return;
  }
  $("chartCard").style.opacity = 1;
  const n = perGroup(p1 / 100, p2 / 100, zb, drop / 100);
  $("result").innerHTML = `You need <b>${fmt(n)} participants per group</b> (${fmt(n * 2)} in total).`;
  lastArgs = [p1, p2, zb, drop, n];
  drawChart(...lastArgs);
}

const fmt = x => x.toLocaleString("en");
let lastArgs = null;
addEventListener("resize", () => lastArgs && drawChart(...lastArgs));

// Participants per group (y) for differences of 5-40 percentage points (x),
// keeping the "without intervention" value, power and drop-out as set.
function drawChart(p1, p2, zb, drop, current) {
  const svg = $("chart");
  const W = Math.max(280, Math.round(svg.parentElement.clientWidth - 40)), H = 240;
  const L = 52, R = 22, T = 20, B = 40, X0 = 5, X1 = 40;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const dir = p1 > p2 ? 1 : -1;

  // Skip differences that would push the intervention group outside 1-99%.
  const pts = [];
  for (let d = X0; d <= X1; d++) {
    const q = p2 + dir * d;
    if (q >= 1 && q <= 99) pts.push([d, perGroup(q / 100, p2 / 100, zb, drop / 100)]);
  }
  const diff = Math.abs(p1 - p2);
  const onChart = diff >= X0 && diff <= X1;
  const yMaxRaw = Math.max(...pts.map(p => p[1]), onChart ? current : 0, 1);
  const step = niceStep(yMaxRaw / 4);
  const yMax = Math.ceil(yMaxRaw / step) * step;
  const x = d => L + (d - X0) / (X1 - X0) * (W - L - R);
  const y = v => T + (1 - v / yMax) * (H - T - B);

  let g = "";
  for (let i = 0; i * step <= yMax; i++) {
    const v = i * step;
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>` +
         `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  }
  for (const d of [5, 10, 20, 30, 40]) g += `<text x="${x(d)}" y="${H - B + 18}" text-anchor="middle">${d}</text>`;
  g += `<text x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle">Difference between groups (pp)</text>`;
  g += `<text x="${L}" y="${T - 8}">Participants per group</text>`;
  if (pts.length) g += `<path class="curve" d="${pts.map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join("")}"/>`;

  if (onChart) {
    const cx = x(diff), cy = y(current), end = cx > W - 130;
    g += `<circle class="dot" cx="${cx}" cy="${cy}" r="5"/>` +
         `<text class="label" x="${cx + (end ? -10 : 10)}" y="${cy - 10}" text-anchor="${end ? "end" : "start"}">Your study: ${fmt(current)}</text>`;
  } else {
    g += `<text class="label" x="${W - R}" y="${T + 14}" text-anchor="end">Your study (${diff} pp) is outside 5–40 pp</text>`;
  }
  g += `<g id="hover" visibility="hidden"><line class="hair" y1="${T}" y2="${H - B}"/><circle class="dot" r="4"/><text class="label"></text></g>`;
  g += `<rect id="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>`;
  svg.innerHTML = g;

  // Tooltip: snap to the nearest whole percentage point on the curve.
  const hover = svg.querySelector("#hover"), hit = svg.querySelector("#hit");
  const show = e => {
    if (!pts.length) return;
    const box = svg.getBoundingClientRect();
    const d = X0 + ((e.clientX - box.left) * W / box.width - L) / (W - L - R) * (X1 - X0);
    const p = pts.reduce((a, b) => Math.abs(b[0] - d) < Math.abs(a[0] - d) ? b : a);
    const hx = x(p[0]), hy = y(p[1]), left = hx > W / 2;
    hover.querySelector("line").setAttribute("x1", hx);
    hover.querySelector("line").setAttribute("x2", hx);
    hover.querySelector("circle").setAttribute("cx", hx);
    hover.querySelector("circle").setAttribute("cy", hy);
    const tip = hover.querySelector("text");
    tip.textContent = `${p[0]} pp → ${fmt(p[1])} per group`;
    tip.setAttribute("x", hx + (left ? -8 : 8));
    tip.setAttribute("y", T + 14);
    tip.setAttribute("text-anchor", left ? "end" : "start");
    hover.setAttribute("visibility", "visible");
  };
  hit.addEventListener("pointermove", show);
  hit.addEventListener("pointerdown", show);
  hit.addEventListener("pointerleave", () => hover.setAttribute("visibility", "hidden"));
}

function niceStep(raw) {
  const p = 10 ** Math.floor(Math.log10(raw));
  return [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= raw);
}

function setPower(btn) {
  powerButtons.forEach(b => b.setAttribute("aria-pressed", b === btn));
  update();
}

["p1", "p2", "drop"].forEach(id => $(id).addEventListener("input", update));
powerButtons.forEach(b => b.addEventListener("click", () => setPower(b)));
$("example").addEventListener("click", () => {
  $("p2").value = 40; $("p1").value = 60; $("drop").value = 10;
  $("exampleText").hidden = false;
  setPower(powerButtons[0]);
});

update();
</script>
</body>
</html>
