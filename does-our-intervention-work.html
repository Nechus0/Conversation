<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Does our intervention work?</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1a1d21; --muted: #6b7280; --line: #e5e7eb; --accent: #0b7a5a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111315; --card: #1a1d21; --text: #e8eaed; --muted: #9aa0a6; --line: #2a2e33; --accent: #4cc79f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 1.6rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .field { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; }
  .field + .field { border-top: 1px solid var(--line); }
  input { width: 90px; font: inherit; text-align: right; padding: 8px 10px; border-radius: 8px;
          border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .seg { display: flex; gap: 6px; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .seg button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #result { font-size: 1.5rem; font-weight: 700; text-align: center; margin: 28px 0; }
  #result b { color: var(--accent); }
  .chart { margin-bottom: 24px; }
  .chart h2 { font-size: 1rem; margin: 0 0 8px; }
  .chart svg { width: 100%; height: auto; display: block; touch-action: none; }
  .chart text { fill: var(--muted); font-size: 12px; }
  .chart .grid { stroke: var(--line); }
  .chart .curve { fill: none; stroke: var(--accent); stroke-width: 2; }
  .chart .you { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
  .chart .you-label { fill: var(--text); font-weight: 700; }
  .chart .hair { stroke: var(--muted); stroke-dasharray: 3 3; }
  .chart .tip { fill: var(--text); font-weight: 600; }
  .example { text-align: center; }
  #exampleText { color: var(--muted); margin: 10px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Does our intervention work?</h1>

  <div class="card">
    <label class="field">Outcome without intervention (%) <input type="number" id="p2" min="1" max="99" value="40"></label>
    <label class="field">Outcome with intervention (%) <input type="number" id="p1" min="1" max="99" value="60"></label>
    <div class="field">Power
      <div class="seg" id="power">
        <button data-z="0.8416" aria-pressed="true">80%</button>
        <button data-z="1.2816" aria-pressed="false">90%</button>
      </div>
    </div>
    <label class="field">Drop-out (%) <input type="number" id="drop" min="0" max="90" value="10"></label>
  </div>

  <p id="result" aria-live="polite"></p>

  <div class="card chart" id="chartCard">
    <h2>Smaller differences need more participants</h2>
    <svg id="chart" role="img" aria-label="Participants per group by difference between groups"></svg>
  </div>

  <div class="example">
    <button id="example">Try an example</button>
    <p id="exampleText" hidden>A text-message reminder raises second-dose vaccine returns from 40% to 60%.</p>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const powerButtons = document.querySelectorAll("#power button");

const fmt = x => x.toLocaleString("en");

function perGroup(p1, p2, zb, drop) {
  const pbar = (p1 + p2) / 2;
  const n = (1.96 * Math.sqrt(2 * pbar * (1 - pbar)) + zb * Math.sqrt(p1 * (1 - p1) + p2 * (1 - p2))) ** 2 / (p1 - p2) ** 2;
  return Math.ceil(n / (1 - drop) - 1e-9);
}

function update() {
  const p2 = $("p2").valueAsNumber / 100, p1 = $("p1").valueAsNumber / 100, drop = $("drop").valueAsNumber / 100;
  const zb = +document.querySelector("#power [aria-pressed=true]").dataset.z;
  const valid = [p1, p2].every(p => p > 0 && p < 1) && drop >= 0 && drop < 1 && p1 !== p2;
  $("chartCard").style.opacity = valid ? 1 : 0.35;

  if (![p1, p2].every(p => p > 0 && p < 1) || !(drop >= 0 && drop < 1)) {
    $("result").textContent = "Enter percentages between 1 and 99.";
    return;
  }
  if (p1 === p2) {
    $("result").textContent = "The groups must differ.";
    return;
  }
  const n = perGroup(p1, p2, zb, drop);
  $("result").innerHTML = `You need <b>${fmt(n)} participants per group</b> (${fmt(n * 2)} in total).`;
  drawChart(p1, p2, zb, drop, n);
}

// Line chart: participants per group (y) against the difference between groups (x),
// keeping the "without intervention" value fixed. The user's study is marked.
function drawChart(p1, p2, zb, drop, current) {
  const svg = $("chart");
  const W = Math.max(280, Math.round(svg.parentElement.clientWidth - 40)), H = 240, L = 52, R = 22, T = 16, B = 40;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  lastArgs = [p1, p2, zb, drop, current];
  const dir = p1 > p2 ? 1 : -1;
  const diffNow = Math.abs(p1 - p2) * 100;
  const maxFeasible = dir > 0 ? 99 - p2 * 100 : p2 * 100 - 1;
  const xMin = Math.max(1, Math.min(5, diffNow));
  const xMax = Math.max(xMin + 1, Math.min(maxFeasible, Math.max(40, diffNow + 10)));

  const pts = [];
  for (let i = 0; i <= 80; i++) {
    const d = xMin + (xMax - xMin) * i / 80;
    pts.push([d, perGroup(p2 + dir * d / 100, p2, zb, drop)]);
  }
  const yMaxRaw = Math.max(...pts.map(p => p[1]), current);
  const step = niceStep(yMaxRaw / 4);
  const yMax = Math.ceil(yMaxRaw / step) * step;
  const x = d => L + (d - xMin) / (xMax - xMin) * (W - L - R);
  const y = v => T + (1 - v / yMax) * (H - T - B);

  let g = "";
  for (let v = 0; v <= yMax; v += step) {
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>` +
         `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  }
  const xStep = niceStep((xMax - xMin) / 5);
  for (let d = Math.ceil(xMin / xStep) * xStep; d <= xMax; d += xStep) {
    g += `<text x="${x(d)}" y="${H - B + 18}" text-anchor="middle">${d}</text>`;
  }
  g += `<text x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle">Difference between groups (% points)</text>`;
  g += `<path class="curve" d="${pts.map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join("")}"/>`;

  const cx = x(diffNow), cy = y(current);
  const anchor = cx > W - 130 ? "end" : "start";
  g += `<circle class="you" cx="${cx}" cy="${cy}" r="5"/>` +
       `<text class="you-label" x="${cx + (anchor === "start" ? 10 : -10)}" y="${cy - 10}" text-anchor="${anchor}">Your study: ${fmt(current)}</text>`;
  g += `<g id="hover" visibility="hidden"><line class="hair" y1="${T}" y2="${H - B}"/><circle class="you" r="4"/><text class="tip"></text></g>`;
  g += `<rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="hit"/>`;
  svg.innerHTML = g;

  // Hover: snap to the nearest point and read out its value.
  const hover = svg.querySelector("#hover");
  const hit = svg.querySelector("#hit");
  hit.addEventListener("pointermove", e => {
    const box = svg.getBoundingClientRect();
    const px = (e.clientX - box.left) * W / box.width;
    const d = xMin + (px - L) / (W - L - R) * (xMax - xMin);
    const p = pts.reduce((a, b) => Math.abs(b[0] - d) < Math.abs(a[0] - d) ? b : a);
    const hx = x(p[0]), hy = y(p[1]);
    hover.querySelector("line").setAttribute("x1", hx);
    hover.querySelector("line").setAttribute("x2", hx);
    hover.querySelector("circle").setAttribute("cx", hx);
    hover.querySelector("circle").setAttribute("cy", hy);
    const tip = hover.querySelector("text");
    tip.textContent = `${p[0].toFixed(0)} points → ${fmt(p[1])} per group`;
    tip.setAttribute("x", hx > W / 2 ? hx - 8 : hx + 8);
    tip.setAttribute("y", T + 14);
    tip.setAttribute("text-anchor", hx > W / 2 ? "end" : "start");
    hover.setAttribute("visibility", "visible");
  });
  hit.addEventListener("pointerleave", () => hover.setAttribute("visibility", "hidden"));
}

let lastArgs = null;
addEventListener("resize", () => lastArgs && drawChart(...lastArgs));

function niceStep(raw) {
  const p = 10 ** Math.floor(Math.log10(raw));
  return [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= raw);
}

function setPower(btn) {
  powerButtons.forEach(b => b.setAttribute("aria-pressed", b === btn));
  update();
}

["p1", "p2", "drop"].forEach(id => $(id).addEventListener("input", update));
powerButtons.forEach(b => b.addEventListener("click", () => setPower(b)));
$("example").addEventListener("click", () => {
  $("p2").value = 40; $("p1").value = 60; $("drop").value = 10;
  $("exampleText").hidden = false;
  setPower(powerButtons[0]);
});

update();
</script>
</body>
</html>
